<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96" fill="none" role="img" aria-label="PitchForge">
  <defs>
    <linearGradient id="pfAmber" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBC25A"/>
      <stop offset="1" stop-color="#E07B16"/>
    </linearGradient>
    <radialGradient id="pfGlow" cx="0.5" cy="0.3" r="0.72">
      <stop stop-color="#F59E1B" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F59E1B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- carbon tile + forge glow -->
  <rect x="8" y="8" width="80" height="80" rx="20" fill="#110E0A"/>
  <rect x="8" y="8" width="80" height="80" rx="20" fill="url(#pfGlow)"/>

  <!-- mark (32-grid scaled 2.5x, offset +8) -->
  <g transform="translate(8,8) scale(2.5)">
    <g stroke="url(#pfAmber)" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M5.2 13.4 A 3 3 0 0 0 5.2 18.6" opacity="0.9"/>
      <path d="M3.3 12 A 4.9 4.9 0 0 0 3.3 20" opacity="0.5"/>
    </g>
    <path d="M6.6 16 L11 13.4 H24.4 a1.6 1.6 0 0 1 1.6 1.6 V16.4 a1.6 1.6 0 0 1 -1.6 1.6 H11 Z" fill="url(#pfAmber)"/>
    <path d="M14 18 H21.6 L20.3 21.8 H22.7 V24.4 H13 V21.8 H15.4 Z" fill="url(#pfAmber)"/>
    <path d="M24.7 8 L25.4 9.9 L27.3 10.6 L25.4 11.3 L24.7 13.2 L24 11.3 L22.1 10.6 L24 9.9 Z" fill="#FFD27A"/>
  </g>

  <!-- wordmark -->
  <text x="108" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#ECE7DE">Pitch<tspan fill="#F5A623">Forge</tspan></text>
  <text x="110" y="78" font-family="'Consolas', 'SF Mono', monospace" font-size="12" letter-spacing="3" fill="#9A8F7E">COMMUNICATION FLIGHT SIMULATOR</text>
</svg>
